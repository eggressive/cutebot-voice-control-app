plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.cutebotvoice'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.cutebotvoice"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Moto G14 is arm64-v8a. Keep armeabi-v7a for older/cheap Android phones.
        // Drop x86, x86_64, mips, mips64 - those are emulators/very old tablets.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        // Runtime permission checks are present; lint cannot trace them across methods.
        disable 'MissingPermission'
        checkDependencies true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
